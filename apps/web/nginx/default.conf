# The web app (Vite build) on 8080, with /api and /healthz proxied to the API container. The app
# calls the API on its own origin (VITE_API_BASE_URL empty), so no CORS is involved.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Resolve the API through Docker's DNS on every request (cached 10 s): a recreated api
    # container gets a new IP, and a name in proxy_pass would be resolved once at startup. With a
    # variable and no URI part, proxy_pass forwards the original URI (/api/..., /healthz) as is.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Only server-level add_header: a location with its own add_header would drop these.
    # style-src-attr: ECharts' HTML tooltip writes style attributes through innerHTML; style
    # elements and stylesheets stay 'self' only, and scripts never run inline.
    # connect-src names ws/wss on the page's own host:port, which 'self' misses in older browsers.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://$http_host wss://$http_host; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        proxy_pass $api_upstream;
    }

    # Live availability: WebSocket upgrade; the API sends a heartbeat every 15 s, so 1 h of
    # silence means the socket is dead.
    location /api/v1/live/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build output: cache for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The entry point must always be revalidated, or a deploy keeps serving old asset names.
    location = /index.html {
        expires -1;
    }

    # SPA fallback.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
